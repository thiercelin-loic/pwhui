<div class="container">
    <header class="row align-items-center">
        <div class="col text-start">
            <p>{{today}} {{month}} {{year}}</p>
            <h5>Chat</h5>
        </div>
        <div class="col text-end">
            <span class="notification" role="button" title="Notifications" data-bs-toggle="modal"
                data-bs-target="#sessionToastsModal">
                <ng-container *ngIf="(toast.history$ | async) as history">
                    <span class="badge" *ngIf="history.length > 0">{{history.length}}</span>
                </ng-container>
            </span>
        </div>
    </header>
    <section>
        <h4><span class="chat"></span>Inbox</h4>
        <div class="row" *ngFor="let conversation of conversations">
            <button class="btn btn-primary text-start" data-bs-toggle="modal" data-bs-target="#exampleModal"
                id="conversation" (click)="selectConversation(conversation)">
                <p class="listing">{{ getListingById(conversation.listing)?.name || conversation.listing }}</p>
                <p class="preview">{{ getLastMessage(conversation) }}</p>
            </button>
        </div>
        <div *ngIf="!conversations.length" class="text-center">
            <p>You have no conversations yet.</p>
        </div>
    </section>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel" *ngIf="selectedConversation">
                    {{ getListingById(selectedConversation.listing)?.name || selectedConversation.listing }}
                </h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ng-container *ngIf="messages.length > 0">
                    <div class="text-end in" *ngFor="let msg of (isPingOwner ? messages[0].ping : messages[0].pong)">
                        <b>{{auth.current?.first_name}}</b>
                        <p>{{ msg }}</p>
                    </div>
                    <div class="text-start" *ngFor="let msg of (isPingOwner ? messages[0].pong : messages[0].ping)">
                        <b>{{ isPingOwner ? 'Host' : 'Guest' }}</b>
                        <p>{{ msg }}</p>
                    </div>
                </ng-container>
            </div>
            <div class="modal-footer">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Type your message" [(ngModel)]="newMessage"
                        (keyup.enter)="sendMessage()" aria-describedby="button-addon2">
                    <button class="btn btn-primary" type="button" id="button-addon2" (click)="sendMessage()"
                        [disabled]="!newMessage.trim()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>
