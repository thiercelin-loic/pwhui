<div class="modal fade" id="policy" tabindex="-1" aria-labelledby="policy" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <span class="cookie"></span>
                <h1 class="modal-title fs-5"><b>{{ 'POLICY.TITLE' | translate }}</b></h1>
            </div>
            <div class="modal-body">
                <p [innerHTML]="'POLICY.DESCRIPTION' | translate"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="consent()">
                    {{ 'POLICY.I_AGREE' | translate }}
                </button>
            </div>
        </div>
    </div>
</div>
