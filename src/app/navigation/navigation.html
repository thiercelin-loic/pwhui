<div class="row text-center">
    <div class="col-sm" routerLink="">
        <span class="home"></span>
        <small>{{ 'NAVIGATION.HOME' | translate }}</small>
    </div>
        @if (!isLogged) {
            <div class="col-sm" routerLink="auth">
                <span class="account"></span>
                <small>{{ 'NAVIGATION.LOGIN_SIGNUP' | translate }}</small>
            </div>
        } @else {
            <div class="col-sm" routerLink="profil">
                <span class="profil"></span>
                <small>{{ 'NAVIGATION.PROFIL' | translate }}</small>
            </div>
            <div class="col-sm" routerLink="chat">
                <span class="chat"></span>
                <small>{{ 'NAVIGATION.CHAT' | translate }}</small>
            </div>
        }
    <div class="col-sm" routerLink="settings">
        <span class="settings"></span>
        <small>{{ 'NAVIGATION.SETTINGS' | translate }}</small>
    </div>
</div>
